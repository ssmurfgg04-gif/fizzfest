name: stats

# After an entry merges: recount the party, update stats.json (feeds the
# README badge), commit if anything changed.
on:
  push:
    branches: [main]
    paths:
      - "entries/**"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: recount
        run: python3 .github/scripts/stats.py
      - name: commit if changed
        run: |
          git config user.name "fizzbot"
          git config user.email "actions@github.com"
          git add stats.json
          git diff --cached --quiet || git commit -m "🥤 party stats update [skip ci]"
          git push
